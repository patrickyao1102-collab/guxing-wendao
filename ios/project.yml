name: Guxing
options:
  bundleIdPrefix: com.guxing
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""            # ← 在 Xcode 里选你的开发者账号后会自动填；命令行也可传 DEVELOPMENT_TEAM=XXXX
    CODE_SIGN_STYLE: Automatic

targets:
  Guxing:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: App/web            # 蓝色文件夹引用：整目录原样打进 App，运行时 Bundle/web/<路径> 读取
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guxing.wendao
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO        # 用下面 info: 这份，不让 Xcode 自动生成
        TARGETED_DEVICE_FAMILY: "1,2"     # iPhone + iPad
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: 孤星问道
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UIStatusBarHidden: true
        UIRequiresFullScreen: true
        UILaunchScreen:
          UIColorName: LaunchBg
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
