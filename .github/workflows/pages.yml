name: 发布游戏到 GitHub Pages

on:
  push:
    branches: [main]
    paths: ["game/**", "tools/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 装 numpy（加扰用）
        run: pip install numpy
      - name: 组装站点 —— 根目录放明文开发版（浏览器可玩）、app/ 放加扰正式版（APK 更新源）
        run: |
          python3 tools/build_release.py release                 # 去测试面板 + 删废图 + 加扰
          python3 tools/make_manifest.py release "${GITHUB_SHA::7}"   # 加扰包的清单（version.json 明文）
          python3 tools/make_manifest.py game "${GITHUB_SHA::7}"      # 根目录开发版清单
          mkdir -p _site
          cp -r game/. _site/
          mkdir -p _site/app
          cp -r release/. _site/app/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
