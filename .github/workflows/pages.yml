name: 发布游戏到 GitHub Pages

on:
  push:
    branches: [main]
    paths: ["game/**", "tools/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 装 numpy（加扰用）
        run: pip install numpy
      - name: 组装站点 —— 根目录放加扰正式版（APK 自动更新源；素材字节加扰，防随手扒包）
        # 注意：GitHub Pages 单站点上限 1GB。明文版 + 加扰版同站会到 ~1.6GB 直接超限部署失败，
        # 所以这里只发加扰正式版。浏览器试玩走 /play/（见下一步），APK 更新器 Updater.BASE 指向本站根目录。
        run: |
          python3 tools/build_release.py release                      # 去测试面板 + 删废图 + 素材加扰
          python3 tools/make_manifest.py release "${GITHUB_SHA::7}"   # 更新清单（version.json 保持明文）
          mkdir -p _site
          cp -r release/. _site/
      - name: 浏览器测试版 /play/（带测试面板；只进测试版的文件加扰后放 play/t/，连同清单一起发布；浏览器按清单取文件，见 tools/play/sw.js）
        run: python3 tools/build_play.py _site "${GITHUB_SHA}"
      - name: 纯净版 /pure/（作者 11-11：没有一张废稿废图；去掉测试面板；正式版剔掉的文件直接 404，不从仓库补）
        run: |
          mkdir -p _site/pure
          cp tools/pure/index.html tools/pure/sw.js _site/pure/
          python3 -c "import sys; sys.argv=['x','/tmp/x']; sys.path.insert(0,'tools'); import build_release as b; open('_site/pure/game.html','w',encoding='utf8').write(b.strip_test_panel(open('game/index.html',encoding='utf8').read()))"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # GitHub 自己偶尔抽风（11-13 出过一次「Fetching artifact metadata failed」）：发布失败就等半分钟再试一次，不然测试版会停在旧版本上
      - name: 发布失败 → 等 30 秒
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - name: 发布失败 → 再试一次
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
