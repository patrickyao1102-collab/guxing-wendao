name: 打包安卓 APK

on:
  push:
    branches: [main]
    paths: ["android/**", "game/**", "tools/**", ".github/workflows/apk.yml"]
  workflow_dispatch:
    inputs:
      bundle_game:
        description: "把当前 game/ 整个打进 APK（首次安装不用下载）"
        default: "true"
      full:
        description: "另外打一个「完整版」：测试版里的全部新内容都打进包里，完全离线"
        default: "false"

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - name: 接受 SDK 许可并装 build-tools（runner 自带 Android SDK）
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: 签名密钥（首次生成，之后从缓存取，保证每次打包签名一致）
        id: ks
        uses: actions/cache@v4
        with:
          path: ~/.guxing-ks
          key: guxing-keystore-v1
      - name: 生成签名密钥（仅首次）
        run: |
          mkdir -p ~/.guxing-ks
          if [ ! -f ~/.guxing-ks/guxing.jks ]; then
            PASS=$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 20)
            echo -n "$PASS" > ~/.guxing-ks/pass
            keytool -genkeypair -keystore ~/.guxing-ks/guxing.jks -storepass "$PASS" -keypass "$PASS" -alias guxing -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Guxing Wendao, O=Guxing, C=AU"
          fi
      - name: 装 numpy（加扰用）
        run: pip install numpy
      - name: 构建加扰正式版并打进 APK 的 assets（去测试面板 / 删废图 / 素材加扰）
        run: |
          python3 tools/build_release.py release
          python3 tools/make_manifest.py release "${GITHUB_SHA::7}"
          # 整包素材只进纯净版（pure）；测试版（dev）是个小壳，直接开线上测试页
          mkdir -p android/app/src/pure/assets
          cp -r release/. android/app/src/pure/assets/
      - name: 完整版（只在手动触发、勾了 full 时打）：测试版全部内容 + 去测试面板 + 加扰，完全离线
        if: github.event_name == 'workflow_dispatch' && inputs.full == 'true'
        run: |
          python3 tools/build_release.py release_full --keep-test
          python3 tools/make_manifest.py release_full "full-${GITHUB_SHA::7}"
          mkdir -p android/app/src/full/assets
          cp -r release_full/. android/app/src/full/assets/
          rm -rf release_full
      - name: 编译
        working-directory: android
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.${{ github.run_number }}
        run: |
          export KS_FILE=$HOME/.guxing-ks/guxing.jks
          export KS_PASS=$(cat $HOME/.guxing-ks/pass)
          set -o pipefail; gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee ../build.log
      - name: 失败时把日志尾部发到 Issue（方便远程查看）
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          { echo '```'; grep -v '^\s*at ' build.log | tail -150; echo '```'; } > body.md
          gh issue create --title "APK 构建失败 #${{ github.run_number }}" --body-file body.md || true
      - name: 整理产物
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/pure/release/app-pure-release.apk out/guxing-wendao.apk
          cp android/app/build/outputs/apk/dev/release/app-dev-release.apk out/guxing-wendao-test.apk
          if [ -d android/app/src/full/assets ]; then cp android/app/build/outputs/apk/full/release/app-full-release.apk out/guxing-wendao-full.apk; fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: guxing-wendao-apk, path: out/ }
      - name: 发布到 Releases（latest）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 孤星问道 安卓包（自动更新版）
          body: "安装一次即可；之后每次打开自动检查并下载更新。构建 ${{ github.sha }}"
          files: |
            out/guxing-wendao.apk
            out/guxing-wendao-test.apk
          prerelease: false
      - name: 发布完整版（单独一个 Release：full）
        if: github.event_name == 'workflow_dispatch' && inputs.full == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: full
          name: 孤星问道 完整版（离线快照）
          body: "测试版里的全部内容都在包里，装上就能玩、完全不联网，不会自动更新（是 ${{ github.sha }} 这一刻的快照）。可以和纯净版、测试版同时安装，存档互不相通。"
          files: out/guxing-wendao-full.apk
          prerelease: true
