<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>孤星问道 · 测试版</title>
<style>html,body{margin:0;height:100%;background:#05070d url(https://raw.githubusercontent.com/patrickyao1102-collab/guxing-wendao/main/game/r157/bg_01.webp) center/cover no-repeat;color:#f5e6c4;font-family:"Songti SC","Noto Serif SC",serif;display:flex;align-items:flex-end;justify-content:center;text-align:center}body>div{margin-bottom:8vh;text-shadow:0 2px 6px #000}b{font-size:44px;color:#ffd66b;display:block;margin-bottom:12px}</style></head>
<body><div><b>孤星问道</b><div id="m">正在准备测试版……</div></div>
<script>
// 先装好 Service Worker（负责把加扰的素材还原），再进游戏
(async () => {
  const m = document.getElementById('m');
  if (!('serviceWorker' in navigator)) { m.textContent = '这个浏览器不支持试玩（需要 Service Worker），请换 Chrome / Safari 最新版'; return; }
  try {
    const reg = await navigator.serviceWorker.register('sw.js', { scope: './', updateViaCache: 'none' });
    // 每次进来先问一遍有没有新版的 Service Worker，有就等它接管再进游戏（不然新加的素材要刷新两次才出得来）
    try { m.textContent = '正在检查更新……'; await reg.update(); const w = reg.installing || reg.waiting; if (w) await new Promise(r => { navigator.serviceWorker.addEventListener('controllerchange', r, { once: true }); setTimeout(r, 5000); }); } catch (e) {}
    await navigator.serviceWorker.ready;
    if (!navigator.serviceWorker.controller) await new Promise(r => { navigator.serviceWorker.addEventListener('controllerchange', r, { once: true }); setTimeout(r, 3000); });
    location.replace('game.html' + location.hash);
  } catch (e) { m.textContent = '准备失败：' + e.message + '（刷新一下再试）'; }
})();
</script></body></html>
